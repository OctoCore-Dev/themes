name: Validate Themes & Build Catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: themes-catalog-sync
  cancel-in-progress: false

jobs:
  validate:
    name: 🎨 Validate Theme Packages & Build Catalog
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🌐 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔍 Validate Themes & Generate catalog.json
        run: node scripts/build-catalog.js

      - name: 🚀 Commit Updated catalog.json (Only on push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "OctoBot"
          git config --global user.email "bot@octocore.dev"
          git add catalog.json
          if git diff --staged --quiet; then
            echo "No changes in catalog.json"
          else
            git commit -m "chore(catalog): auto-regenerate catalog.json [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: 🧹 Purge jsDelivr CDN Cache (Instant Client Updates)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Purging catalog.json from jsDelivr CDN..."
          curl -s "https://purge.jsdelivr.net/gh/OctoCore-Dev/themes@main/catalog.json" || true
          
          echo "Purging themes manifests..."
          for theme in themes/*/theme.json; do
            if [ -f "$theme" ]; then
              echo "Purging $theme..."
              curl -s "https://purge.jsdelivr.net/gh/OctoCore-Dev/themes@main/$theme" || true
            fi
          done

          echo "Purging git-modified assets..."
          CHANGED_FILES=$(git diff --name-only HEAD~2 HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              echo "Purging $file..."
              curl -s "https://purge.jsdelivr.net/gh/OctoCore-Dev/themes@main/$file" || true
            fi
          done
          echo "✅ All jsDelivr caches purged successfully!"


